services:
  baize:
    build: .
    image: baize:local
    container_name: baize
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内监听所有地址，宿主机只发布回环端口
      ANSWERER_HOST: 0.0.0.0
      ANSWERER_PORT: "8787"
      ANSWERER_LOG_FILE: /data/answers.jsonl
      # 如果宿主机通过代理出网（mihomo / clash 等），取消下面两行并改成你的端口。
      # Linux 下 host.docker.internal 由 extra_hosts 提供。
      # HTTPS_PROXY: http://host.docker.internal:7890
      # HTTP_PROXY: http://host.docker.internal:7890
      # NO_PROXY: 127.0.0.1,localhost
    ports:
      # 前面加 127.0.0.1: 是刻意的：容器端口只暴露给本机浏览器，不对局域网开放
      - "127.0.0.1:8787:8787"
    volumes:
      - ./logs:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
