<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="baize 白泽">
  <defs>
    <radialGradient id="glow" cx="18%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#35C2A8" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#35C2A8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B0D10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#35C2A8"/>
      <stop offset="55%" stop-color="#4EA1FF"/>
      <stop offset="100%" stop-color="#8B7CF6"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#E6E8EB" fill-opacity="0.055"/>
    </pattern>
    <clipPath id="round"><rect x="0" y="0" width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="#0B0D10"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- 左侧竖线装饰 -->
    <rect x="72" y="92" width="3" height="136" rx="1.5" fill="url(#mark)" opacity="0.9"/>

    <!-- 词标 -->
    <text x="100" y="168" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="94" font-weight="700" letter-spacing="-3" fill="#E6E8EB">baize</text>
    <text x="104" y="212" font-family="ui-sans-serif, 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="26" font-weight="500" fill="#8B929C" letter-spacing="6">白泽</text>

    <!-- 副标题 -->
    <text x="104" y="252" font-family="ui-sans-serif, 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="17" fill="#8B929C">OCS 网课脚本的 AI 题库兼容层 —— 收题，问模型，还它一句能匹配的答案</text>
    <text x="104" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12.5" fill="#5B6572">ocsjs 5.4.2 compatible · zero dependencies · node 22 · loopback only</text>

    <!-- 右侧图形：三层叠片 + 眼 -->
    <g transform="translate(946 78)">
      <rect x="0" y="0" width="170" height="170" rx="34" fill="none" stroke="#1F242B" stroke-width="2"/>
      <path d="M52 118 C52 86, 78 62, 108 58" fill="none" stroke="url(#mark)" stroke-width="4" stroke-linecap="round"/>
      <path d="M62 128 C66 100, 90 80, 118 78" fill="none" stroke="#E0A458" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      <path d="M74 138 C80 118, 98 104, 124 100" fill="none" stroke="#4EA1FF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
      <circle cx="118" cy="58" r="5.5" fill="#35C2A8"/>
      <circle cx="118" cy="58" r="11" fill="#35C2A8" fill-opacity="0.18"/>
      <path d="M40 40 h34" stroke="#1F242B" stroke-width="2" stroke-linecap="round"/>
      <path d="M40 48 h18" stroke="#1F242B" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
