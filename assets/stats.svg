<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="0 依赖 / 4 协议 / 1 进程">
  <defs>
    <radialGradient id="sg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#35C2A8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B0D10" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sd" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#E6E8EB" fill-opacity="0.045"/>
    </pattern>
    <clipPath id="sr"><rect width="1200" height="200" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#sr)">
    <rect width="1200" height="200" fill="#0B0D10"/>
    <rect width="1200" height="200" fill="url(#sd)"/>
    <rect width="1200" height="200" fill="url(#sg)"/>

    <!-- 竖向分隔线 -->
    <line x1="400" y1="34" x2="400" y2="166" stroke="#1B2027" stroke-width="1"/>
    <line x1="800" y1="34" x2="800" y2="166" stroke="#1B2027" stroke-width="1"/>

    <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
      <!-- 0 -->
      <text x="200" y="96" font-size="56" font-weight="600" fill="#35C2A8">0</text>
      <text x="200" y="126" font-size="14" font-weight="500" fill="#E6E8EB">运行时依赖</text>
      <text x="200" y="152" font-size="12" fill="#6B7480">没有 npm install</text>

      <!-- 4 -->
      <text x="600" y="96" font-size="56" font-weight="600" fill="#4EA1FF">4</text>
      <text x="600" y="126" font-size="14" font-weight="500" fill="#E6E8EB">线协议</text>
      <text x="600" y="148" font-size="12" fill="#6B7480">OpenAI · Anthropic</text>
      <text x="600" y="166" font-size="12" fill="#6B7480">Responses · Gemini</text>

      <!-- 1 -->
      <text x="1000" y="96" font-size="56" font-weight="600" fill="#8B7CF6">1</text>
      <text x="1000" y="126" font-size="14" font-weight="500" fill="#E6E8EB">个进程</text>
      <text x="1000" y="152" font-size="12" fill="#6B7480">没有数据库、队列或守护</text>
    </g>
  </g>
</svg>
